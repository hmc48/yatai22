<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>屋台の道路沿い移動デモ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{font-family:"Yu Gothic",Meiryo,sans-serif;margin:10px}#map{height:68vh;min-height:350px;border:1px solid #aaa}
.panel{margin-top:10px;padding:12px;border:1px solid #ccc}button,select{padding:9px;margin:3px}
.yatai-icon{background:transparent;border:0}.yatai{width:76px;height:60px;transform-origin:center;filter:drop-shadow(1px 2px 2px #5558)}
.yatai svg{width:76px;height:60px}
</style></head><body>
<h2>屋台の道路沿い移動デモ</h2>
<p>地図をクリックしてA地点、続けてB地点を指定し、経路取得後に「移動開始」を押してください。</p>
<div id="map"></div><div class="panel">
<button id="start" disabled>移動開始</button><button id="pause" disabled>一時停止</button>
<button id="reset" disabled>最初に戻す</button><button id="clear">地点をクリア</button>
<label>速度 <select id="speed"><option value="3">低速 3km/h</option><option value="8" selected>中速 8km/h</option><option value="15">高速 15km/h</option><option value="30">かなり高速 30km/h</option><option value="60">超高速 60km/h</option><option value="120">デモ用 120km/h</option></select></label>
<div id="status">地図をクリックしてA地点を指定してください。</div>
<div>経路距離：<span id="distance">--</span></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const map=L.map("map").setView([34.7108,137.7261],15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
let A=null,B=null,ma=null,mb=null,cart=null,line=null,pts=[],cum=[],total=0,pos=0,raf=null,last=null,running=false;
const icon=L.divIcon({className:"yatai-icon",iconSize:[76,60],iconAnchor:[38,30],html:`<div class="yatai"><svg viewBox="0 0 100 78" xmlns="http://www.w3.org/2000/svg"><path d="M18 18L82 18L78 43L22 43Z" fill="#c62828" stroke="#5d1717" stroke-width="2"/><path d="M30 19V42M44 19V42M58 19V42M72 19V42" stroke="#fff3d6" stroke-width="2"/><path d="M12 18L22 6L78 6L89 18Z" fill="#f4c542" stroke="#6b4b16" stroke-width="2"/><rect x="22" y="43" width="56" height="18" fill="#f2a541" stroke="#75451c" stroke-width="2"/><rect x="29" y="47" width="42" height="8" fill="#fff0c2"/><circle cx="32" cy="65" r="7" fill="#333"/><circle cx="68" cy="65" r="7" fill="#333"/><path d="M78 49L94 55" stroke="#654321" stroke-width="3"/></svg></div>`});
function say(t){$("status").textContent=t}
function bearing(a,b){const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dl=(b.lng-a.lng)*r,y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360}
function stop(){running=false;if(raf!==null)cancelAnimationFrame(raf);raf=null;last=null}
function clearAll(){stop();[ma,mb,cart,line].forEach(x=>{if(x)map.removeLayer(x)});A=B=ma=mb=cart=line=null;pts=[];cum=[];total=pos=0;$("distance").textContent="--";$("start").disabled=$("pause").disabled=$("reset").disabled=true}
function mark(p,t,c){return L.circleMarker(p,{radius:8,color:c,weight:3,fillColor:"#fff",fillOpacity:1}).addTo(map).bindTooltip(t,{permanent:true,direction:"top"})}
map.on("click",async e=>{
 if(running)return;
 if(!A||B){clearAll();A=e.latlng;ma=mark(A,"A（出発）","#16833b");say("A地点を指定しました。次にB地点をクリックしてください。");return}
 B=e.latlng;mb=mark(B,"B（到着）","#d22");say("道路経路を検索しています……");
 try{await route()}catch(err){console.error(err);say("経路を取得できませんでした。地点を道路に近づけて選び直してください。");if(mb)map.removeLayer(mb);mb=null;B=null}
});
async function route(){
 const url=`https://router.project-osrm.org/route/v1/driving/${A.lng},${A.lat};${B.lng},${B.lat}?overview=full&geometries=geojson&steps=false`;
 const res=await fetch(url);if(!res.ok)throw Error("OSRM HTTP "+res.status);const d=await res.json();
 if(d.code!=="Ok"||!d.routes?.length)throw Error("No route");
 pts=d.routes[0].geometry.coordinates.map(c=>L.latLng(c[1],c[0]));if(pts.length<2)throw Error("Short route");
 cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+pts[i-1].distanceTo(pts[i]));total=cum.at(-1);
 line=L.polyline(pts,{color:"#1677d2",weight:6,opacity:.85}).addTo(map);map.fitBounds(line.getBounds(),{padding:[35,35]});
 cart=L.marker(pts[0],{icon,zIndexOffset:1000,interactive:false}).addTo(map);
 $("distance").textContent=total>=1000?(total/1000).toFixed(2)+" km":Math.round(total)+" m";pos=0;
 $("start").disabled=false;$("pause").disabled=true;$("reset").disabled=false;say("経路を取得しました。「移動開始」を押してください。")
}
function at(d){
 if(d<=0)return{p:pts[0],a:bearing(pts[0],pts[1])};
 if(d>=total){let n=pts.length;return{p:pts[n-1],a:bearing(pts[n-2],pts[n-1])}}
 let lo=1,hi=cum.length-1;while(lo<hi){let m=(lo+hi)>>1;if(cum[m]<d)lo=m+1;else hi=m}
 let i=lo,t=(d-cum[i-1])/(cum[i]-cum[i-1]||1),p=pts[i-1],q=pts[i];
 return{p:L.latLng(p.lat+(q.lat-p.lat)*t,p.lng+(q.lng-p.lng)*t),a:bearing(p,q)}
}
function update(){let q=at(pos);cart.setLatLng(q.p);let el=cart.getElement(),v=el&&el.querySelector(".yatai");if(v)v.style.transform=`rotate(${q.a}deg)`}
function frame(now){if(!running)return;if(last===null)last=now;let dt=Math.min((now-last)/1000,.1);last=now;pos+=Number($("speed").value)*1000/3600*dt;if(pos>=total){pos=total;update();stop();$("pause").disabled=true;$("start").disabled=true;say("B地点に到着しました。");return}update();raf=requestAnimationFrame(frame)}
$("start").onclick=()=>{if(!pts.length||running)return;if(pos>=total)pos=0;running=true;last=null;$("start").disabled=true;$("pause").disabled=false;say("屋台が移動中です……");raf=requestAnimationFrame(frame)};
$("pause").onclick=()=>{if(!running)return;stop();$("start").disabled=false;$("pause").disabled=true;say("一時停止中です。「移動開始」で再開します。")};
$("reset").onclick=()=>{if(!pts.length)return;stop();pos=0;update();$("start").disabled=false;$("pause").disabled=true;say("出発地点に戻しました。")};
$("clear").onclick=()=>{clearAll();say("地点をクリアしました。A地点をクリックしてください。")};
addEventListener("resize",()=>map.invalidateSize());
})();
</script></body></html>
