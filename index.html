<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>屋台の道路沿い移動デモ（OSM）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic","Meiryo",sans-serif;color:#222;background:#f5f6f7}
.page{max-width:1100px;margin:0 auto;padding:14px}
h1{margin:0 0 8px;font-size:1.35rem}
.help{margin:0 0 12px;line-height:1.6;font-size:.94rem}
#map{width:100%;height:min(68vh,650px);min-height:360px;border:1px solid #bbb;border-radius:8px;background:#e8e8e8}
.panel{margin-top:12px;padding:12px;background:white;border:1px solid #ddd;border-radius:8px}
.buttons{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{min-height:40px;padding:7px 13px;border:1px solid #999;border-radius:6px;background:#fff;color:#222;font-size:.95rem}
button{cursor:pointer}button.primary{background:#1769aa;color:white;border-color:#1769aa}
button:disabled{opacity:.45;cursor:not-allowed}
label{display:inline-flex;gap:7px;align-items:center}
#status{margin-top:10px;min-height:1.5em;line-height:1.5}
#distance{font-variant-numeric:tabular-nums;font-weight:600}
.legend{margin-top:8px;font-size:.86rem;color:#555;line-height:1.5}
.leaflet-tooltip{font-size:13px}
.yatai-icon{background:transparent;border:0}
.yatai-rotator{width:76px;height:60px;transform-origin:50% 50%;filter:drop-shadow(1px 2px 2px #5558)}
.yatai-rotator svg{display:block;width:76px;height:60px;overflow:visible}
@media(max-width:600px){.page{padding:8px}#map{height:58vh;min-height:320px}h1{font-size:1.15rem}}
</style>
</head>
<body>
<main class="page">
<h1>屋台の道路沿い移動デモ</h1>
<p class="help">地図を1回クリックしてA地点、もう1回クリックしてB地点を指定します。道路に沿った経路を取得したあと、「移動開始」を押してください。</p>
<div id="map" aria-label="OpenStreetMap"></div>
<section class="panel">
 <div class="buttons">
  <button id="startBtn" class="primary" disabled>移動開始</button>
  <button id="pauseBtn" disabled>一時停止</button>
  <button id="resetBtn" disabled>最初に戻す</button>
  <button id="clearBtn">地点をクリア</button>
  <label>速度
   <select id="speedSelect">
    <option value="3">低速（時速3km相当）</option>
    <option value="8" selected>中速（時速8km相当）</option>
    <option value="15">高速（時速15km相当）</option>
    <option value="30">かなり高速（時速30km相当）</option>
   </select>
  </label>
 </div>
 <div id="status" role="status">地図をクリックしてA地点を指定してください。</div>
 <div>経路距離：<span id="distance">--</span></div>
 <div class="legend">青い線：道路に沿った移動経路 ／ A：出発地点 ／ B：到着地点<br>※速度はアニメーション上の目安です。実際の交通状況や移動時間を示すものではありません。</div>
</section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(() => {
"use strict";

// 初期表示位置：浜松市付近。必要に応じて変更してください。
const map = L.map("map").setView([34.7108,137.7261],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
 maxZoom:19,
 attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const statusEl=document.getElementById("status");
const distanceEl=document.getElementById("distance");
const startBtn=document.getElementById("startBtn");
const pauseBtn=document.getElementById("pauseBtn");
const resetBtn=document.getElementById("resetBtn");
const clearBtn=document.getElementById("clearBtn");
const speedSelect=document.getElementById("speedSelect");

let pointA=null,pointB=null,markerA=null,markerB=null,yataiMarker=null,routeLine=null;
let routeLatLngs=[],cumulative=[],routeMeters=0,progressMeters=0;
let animationFrame=null,lastFrameTime=null,running=false;

const yataiSvg=`
<div class="yatai-rotator">
<svg viewBox="0 0 100 78" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="屋台">
 <path d="M18 18 L82 18 L78 43 L22 43 Z" fill="#c62828" stroke="#5d1717" stroke-width="2"/>
 <path d="M30 19 V42 M44 19 V42 M58 19 V42 M72 19 V42" stroke="#fff3d6" stroke-width="2"/>
 <path d="M12 18 L22 6 L78 6 L89 18 Z" fill="#f4c542" stroke="#6b4b16" stroke-width="2"/>
 <path d="M22 6 L22 18 M78 6 L78 18" stroke="#6b4b16" stroke-width="2"/>
 <rect x="22" y="43" width="56" height="18" rx="2" fill="#f2a541" stroke="#75451c" stroke-width="2"/>
 <rect x="29" y="47" width="42" height="8" rx="1" fill="#fff0c2"/>
 <circle cx="32" cy="65" r="7" fill="#333" stroke="#111" stroke-width="2"/>
 <circle cx="32" cy="65" r="2" fill="#ddd"/>
 <circle cx="68" cy="65" r="7" fill="#333" stroke="#111" stroke-width="2"/>
 <circle cx="68" cy="65" r="2" fill="#ddd"/>
 <path d="M78 49 L94 55" stroke="#654321" stroke-width="3" stroke-linecap="round"/>
 <path d="M39 2 Q35 -3 40 -7 M51 2 Q47 -3 52 -7 M63 2 Q59 -3 64 -7" fill="none" stroke="#777" stroke-width="2" stroke-linecap="round"/>
</svg></div>`;
const yataiIcon=L.divIcon({className:"yatai-icon",html:yataiSvg,iconSize:[76,60],iconAnchor:[38,30]});

function setStatus(message){statusEl.textContent=message;}
function stopAnimation(){
 running=false;
 if(animationFrame!==null)cancelAnimationFrame(animationFrame);
 animationFrame=null;lastFrameTime=null;
}
function clearRouteAndMarkers(){
 stopAnimation();
 [markerA,markerB,yataiMarker,routeLine].forEach(layer=>{if(layer)map.removeLayer(layer);});
 markerA=markerB=yataiMarker=routeLine=null;
 routeLatLngs=[];cumulative=[];routeMeters=0;progressMeters=0;pointA=pointB=null;
 distanceEl.textContent="--";
 startBtn.disabled=true;pauseBtn.disabled=true;resetBtn.disabled=true;
}
function addPointMarker(latlng,label,color){
 return L.circleMarker(latlng,{radius:8,color,weight:3,fillColor:"#fff",fillOpacity:1})
 .addTo(map).bindTooltip(label,{permanent:true,direction:"top"});
}

map.on("click",async event=>{
 if(running)return;
 if(!pointA||pointB){
  clearRouteAndMarkers();
  pointA=event.latlng;
  markerA=addPointMarker(pointA,"A（出発）","#16833b");
  setStatus("A地点を指定しました。地図をもう一度クリックしてB地点を指定してください。");
  return;
 }
 pointB=event.latlng;
 markerB=addPointMarker(pointB,"B（到着）","#d22");
 setStatus("道路に沿った経路を検索しています……");
 startBtn.disabled=true;
 try{await getRoadRoute();}
 catch(error){
  console.error(error);
  setStatus("経路を取得できませんでした。道路上に近い地点を選び直してください。");
  if(markerB)map.removeLayer(markerB);
  markerB=null;pointB=null;
 }
});

async function getRoadRoute(){
 // OSRM APIの座標順は longitude,latitude です。
 const coords=`${pointA.lng},${pointA.lat};${pointB.lng},${pointB.lat}`;
 const url=`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`;
 const response=await fetch(url);
 if(!response.ok)throw new Error(`OSRM HTTP ${response.status}`);
 const data=await response.json();
 if(data.code!=="Ok"||!data.routes||!data.routes.length)throw new Error("No route found");

 routeLatLngs=data.routes[0].geometry.coordinates.map(c=>L.latLng(c[1],c[0]));
 if(routeLatLngs.length<2)throw new Error("Route is too short");
 cumulative=[0];
 for(let i=1;i<routeLatLngs.length;i++){
  cumulative.push(cumulative[i-1]+routeLatLngs[i-1].distanceTo(routeLatLngs[i]));
 }
 routeMeters=cumulative[cumulative.length-1];
 routeLine=L.polyline(routeLatLngs,{color:"#1677d2",weight:6,opacity:.8}).addTo(map);
 map.fitBounds(routeLine.getBounds(),{padding:[35,35]});
 yataiMarker=L.marker(routeLatLngs[0],{icon:yataiIcon,zIndexOffset:1000,interactive:false}).addTo(map);
 distanceEl.textContent=routeMeters>=1000?`${(routeMeters/1000).toFixed(2)} km`:`${Math.round(routeMeters)} m`;
 progressMeters=0;startBtn.disabled=false;pauseBtn.disabled=true;resetBtn.disabled=false;
 setStatus("経路を取得しました。「移動開始」を押してください。");
}

function positionAtDistance(distance){
 if(distance<=0)return{latlng:routeLatLngs[0],bearing:0};
 if(distance>=routeMeters){
  const n=routeLatLngs.length;
  return{latlng:routeLatLngs[n-1],bearing:routeLatLngs[n-2].bearingTo(routeLatLngs[n-1])};
 }
 let low=0,high=cumulative.length-1;
 while(low<high){const mid=Math.floor((low+high)/2);if(cumulative[mid]<distance)low=mid+1;else high=mid;}
 const i=Math.max(1,low),segmentStart=cumulative[i-1],segmentLength=cumulative[i]-segmentStart;
 const ratio=segmentLength===0?0:(distance-segmentStart)/segmentLength;
 const p1=routeLatLngs[i-1],p2=routeLatLngs[i];
 return{
  latlng:L.latLng(p1.lat+(p2.lat-p1.lat)*ratio,p1.lng+(p2.lng-p1.lng)*ratio),
  bearing:p1.bearingTo(p2)
 };
}
function updateYatai(){
 const result=positionAtDistance(progressMeters);
 yataiMarker.setLatLng(result.latlng);
 const element=yataiMarker.getElement();
 const rotator=element&&element.querySelector(".yatai-rotator");
 if(rotator)rotator.style.transform=`rotate(${result.bearing}deg)`;
}
function animate(timestamp){
 if(!running)return;
 if(lastFrameTime===null)lastFrameTime=timestamp;
 const elapsedSeconds=Math.min((timestamp-lastFrameTime)/1000,.1);
 lastFrameTime=timestamp;
 const kmh=Number(speedSelect.value);
 progressMeters+=(kmh*1000/3600)*elapsedSeconds;
 if(progressMeters>=routeMeters){
  progressMeters=routeMeters;updateYatai();stopAnimation();
  pauseBtn.disabled=true;startBtn.disabled=true;setStatus("B地点に到着しました。");
  return;
 }
 updateYatai();animationFrame=requestAnimationFrame(animate);
}
startBtn.addEventListener("click",()=>{
 if(!routeLatLngs.length||running)return;
 if(progressMeters>=routeMeters)progressMeters=0;
 running=true;lastFrameTime=null;startBtn.disabled=true;pauseBtn.disabled=false;resetBtn.disabled=false;
 setStatus("屋台が移動中です……");animationFrame=requestAnimationFrame(animate);
});
pauseBtn.addEventListener("click",()=>{
 if(!running)return;stopAnimation();startBtn.disabled=false;pauseBtn.disabled=true;
 setStatus("一時停止中です。「移動開始」で続きから再開します。");
});
resetBtn.addEventListener("click",()=>{
 if(!routeLatLngs.length)return;stopAnimation();progressMeters=0;updateYatai();
 startBtn.disabled=false;pauseBtn.disabled=true;resetBtn.disabled=false;
 setStatus("出発地点に戻しました。「移動開始」で再生できます。");
});
clearBtn.addEventListener("click",()=>{
 clearRouteAndMarkers();setStatus("地点をクリアしました。地図をクリックしてA地点を指定してください。");
});
window.addEventListener("resize",()=>map.invalidateSize());
})();
</script>
</body>
</html>
